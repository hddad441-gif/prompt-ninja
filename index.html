<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Ninja AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #05060f; color: #fff; direction: rtl; text-align: right; }
    .glass-card { background: rgba(13, 15, 33, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(168, 85, 247, 0.35); }
    .glass-input { background: rgba(6, 8, 20, 0.9); border: 1px solid rgba(139, 92, 246, 0.35); color: #fff; text-align: right; }
    .prompt-box { unicode-bidi: plaintext; text-align: start; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-3xl mx-auto glass-card rounded-3xl p-6 space-y-6">
    <div class="text-center border-b border-purple-900/50 pb-4">
      <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">برومبت النينجا AI</h1>
      <p class="text-xs text-purple-300/80 mt-1">مولد برومبتات الصور الذكي</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-pink-400 mb-1">المنصة:</label>
        <select id="engine" class="w-full glass-input rounded-xl p-2.5 text-xs">
          <option value="google_flow" class="bg-slate-950">Google Flow / Gemini</option>
          <option value="chatgpt" class="bg-slate-950">ChatGPT / DALL-E 3</option>
          <option value="midjourney" class="bg-slate-950">Midjourney v6.1</option>
          <option value="leonardo" class="bg-slate-950">Leonardo AI</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-cyan-400 mb-1">لغة البرومبت المولد:</label>
        <select id="promptLang" class="w-full glass-input rounded-xl p-2.5 text-xs">
          <option value="en" class="bg-slate-950">الإنجليزية (الأعلى دقة)</option>
          <option value="ar" class="bg-slate-950">العربية</option>
        </select>
      </div>

      <div class="md:col-span-2">
        <label class="block text-xs font-bold text-purple-300 mb-1">وصف الصورة والتفاصيل:</label>
        <input type="text" id="details" dir="auto" placeholder="مثال: طبيب أسنان داخل عيادة مودرن إضاءة سينمائية" class="w-full glass-input rounded-xl p-3 text-xs">
      </div>
    </div>

    <button id="generateBtn" type="button" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-black py-3.5 rounded-2xl text-base shadow-lg cursor-pointer">
      ⚡ توليد البرومبت الآن
    </button>

    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-bold text-pink-400">البرومبت الناتج:</label>
        <button id="copyBtn" type="button" class="text-xs text-purple-300 bg-purple-900/50 px-3 py-1 rounded-lg border border-purple-500/30">نسخ</button>
      </div>
      <textarea id="output" readonly dir="auto" class="prompt-box w-full glass-input rounded-xl p-3 text-xs font-mono text-pink-300 h-28 resize-none"></textarea>
    </div>

    <div id="status" class="hidden text-center text-xs text-emerald-400 bg-emerald-950/50 p-2 rounded-xl border border-emerald-500/30">
      ✓ تم التوليد والنسخ بنجاح!
    </div>
  </div>

  <script>
    document.getElementById('generateBtn').onclick = function() {
      var engine = document.getElementById('engine').value;
      var lang = document.getElementById('promptLang').value;
      var details = document.getElementById('details').value.trim();

      if (!details) {
        details = "A professional high quality commercial photograph";
      }

      var result = "";
      if (lang === "ar") {
        result = "صورة تجارية احترافية فائقة الواقعية لـ " + details + "، دقة 8k، إضاءة سينمائية.";
      } else {
        if (engine === "midjourney") {
          result = details + ", photorealistic commercial shot, studio lighting, 8k --ar 16:9 --v 6.1";
        } else {
          result = "Ultra-realistic commercial photograph of " + details + ", highly detailed, 8k resolution, cinematic composition.";
        }
      }

      var outputEl = document.getElementById('output');
      outputEl.value = result;

      // Copy Fallback
      if (navigator.clipboard) {
        navigator.clipboard.writeText(result);
      }

      var status = document.getElementById('status');
      status.classList.remove('hidden');
      setTimeout(function() { status.classList.add('hidden'); }, 3000);
    };

    document.getElementById('copyBtn').onclick = function() {
      var txt = document.getElementById('output').value;
      if (txt) {
        if (navigator.clipboard) { navigator.clipboard.writeText(txt); }
        alert("تم النسخ!");
      }
    };
  </script>

</body>
</html>
